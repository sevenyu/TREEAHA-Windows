# 触发方式:
#   - 打 tag v* 时自动跑并把产物挂到 Release
#   - 手动在 Actions 页 Run workflow(不发 Release,仅上传 artifact)
#
# 产物:
#   - dist/TREEAHA_*_x64-setup.exe    NSIS 安装包
#   - dist/TREEAHA_*_x64_en-US.msi    MSI(Wix)
#
# 前置:
#   - 仓库根有 pnpm-lock.yaml(pnpm 版本用 pnpm/action-setup 从 package.json 的 packageManager 字段读)
#   - Windows runner 自带 Rust + MSVC + WebView2 SDK,tauri-cli 会现装

name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Tauri)
        run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treeaha-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Attach to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
